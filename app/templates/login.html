<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>JobRadar · Ingresar</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script defer src="/static/login.js"></script>
</head>
<body>
  <main class="login-wrap">
    <form id="login" class="card login-card" autocomplete="on">
      <h1><span class="logo">◎</span> JobRadar</h1>
      <p class="hint">Acceso privado. Ingresa la contraseña de la aplicación.</p>
      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" required autocomplete="current-password" autofocus>
      <button class="btn primary big" type="submit">Ingresar</button>
      <p id="err" class="error" role="alert"></p>
    </form>
  </main>
</body>
</html>
